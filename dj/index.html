<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">

  <title>DJ. Party. Club. Corporate Eevents.</title>
  <meta name="description"
        content="Christian Radarista – DJ für Party, Club und Corporate Events.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .music {
      font-size: 42px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 20px 0 30px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      line-height: 1.8;
    }

    .contact {
      display: inline-block;
      padding: 14px 16px;
      border: 1px solid #222;
      border-radius: 9px;
      color: #171717;
      text-decoration: none;
      font-size: 16px;
      overflow-wrap: anywhere;
      transition: background 0.2s, color 0.2s;
    }

    .contact:hover {
      background: #171717;
      color: #fff;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="music" aria-hidden="true"><img src="djspeaker.jpg" width="70%"></div>

    <h1>CHRISTIAN<br>RADARISTA</h1>

    <div class="subtitle">
      Party. Club.<br>Corporate Eevents.
    </div>

    <a class="contact"
       href="mailto:dj@rerora.de">
      Send E-Mail
    </a>

    <div class="footer">
      Music. Energy. Moments.
    </div>
  </main>
</body>
</html>
