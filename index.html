<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>RERORA – Services für deine Feier</title>
  <meta name="description"
        content="RERORA kommt zurück. Services & Begleitung für deine Feier – persönlich, unkompliziert und direkt vor Ort.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .logo {
      width: 50%;
      max-width: 180px;
      height: auto;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 20px 0 28px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1.5px;
      line-height: 1.8;
      color: #333;
    }

    .privacy {
      margin: 0 auto 30px;
      max-width: 310px;
      font-size: 15px;
      line-height: 1.7;
      color: #444;
    }

    .contacts {
      display: grid;
      gap: 12px;
    }

    .contact {
      display: inline-block;
      padding: 14px 16px;
      border: 1px solid #222;
      border-radius: 9px;
      color: #171717;
      text-decoration: none;
      font-size: 16px;
      overflow-wrap: anywhere;
      transition: background 0.2s, color 0.2s;
    }

    .contact:hover {
      background: #171717;
      color: #fff;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #777;
    }

    .legal-links {
      margin-top: 16px;
      font-size: 12px;
    }

    .legal-links a {
      color: #777;
      text-decoration: underline;
      margin: 0 6px;
    }

    .legal-links a:hover {
      color: #171717;
    }
  </style>
</head>

<body>
  <main class="card">
    <img src="logo_rerora.jpg" alt="RERORA Logo" class="logo">

    <h1>RERORA<br>KOMMT ZURÜCK.</h1>

    <div class="subtitle">
      GUTE MOMENTE. ECHTE ERINNERUNGEN.
    </div>

    <p class="privacy">
      Der passende Service für dein Event oder deine Feier.<br><br>
      <strong>Neues Konzept. Bewährter Name.<br>Demnächst hier.</strong>
    </p>

<!--
    <div class="contacts">
      <a class="contact" href="mailto:kontakt@rerora.de">
        Anfrage senden
      </a>
    </div>
-->

    <div class="footer">
      Persönlich. Unkompliziert. Direkt vor Ort.
      
      <div class="legal-links">
        <a href="impressum.html">Impressum</a> | 
        <a href="datenschutz.html">Datenschutz</a>
      </div>
    </div>
  </main>
</body>
</html>
