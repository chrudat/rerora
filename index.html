<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>rerora media | Event, Audio & Web</title>
  <meta name="description"
        content="rerora - Services & Begleitung für deine Feier – persönlich, unkompliziert und direkt vor Ort.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .logo {
      width: 50%;
      max-width: 180px;
      height: auto;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 7vw, 36px);
      line-height: 1.15;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 20px 0 28px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1.5px;
      line-height: 1.8;
      color: #333;
    }

    .info-text {
      margin: 0 auto 30px;
      max-width: 310px;
      font-size: 15px;
      line-height: 1.7;
      color: #444;
    }

    .contacts {
      display: grid;
      gap: 12px;
    }

    .contact {
      display: inline-block;
      padding: 14px 16px;
      border: 1px solid #222;
      border-radius: 9px;
      color: #171717;
      text-decoration: none;
      font-size: 16px;
      overflow-wrap: anywhere;
      transition: background 0.2s, color 0.2s;
    }

    .contact:hover {
      background: #171717;
      color: #fff;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #777;
    }

    .legal-links {
      margin-top: 16px;
      font-size: 12px;
    }

    .legal-links button {
      background: none;
      border: none;
      color: #777;
      text-decoration: underline;
      padding: 0;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      margin: 0 4px;
    }

    .legal-links button:hover {
      color: #171717;
    }

    /* --- Minimalistisches Legal Modal --- */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 24px;
      border-radius: 16px;
      text-align: left;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-content h2 {
      margin-top: 0;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .modal-content h3 {
      font-size: 14px;
      margin-top: 16px;
      margin-bottom: 6px;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #777;
    }

    .close-btn:hover {
      color: #171717;
    }
  </style>
</head>

<body>
  <main class="card">
    <img src="logo_rerora.jpg" alt="rerora Logo" class="logo">

    <h1>rerora media</h1>

    <div class="subtitle">
      Momente. Emotionen.<br>Erinnerungen.
    </div>

    <p class="info-text">
      Alter Name.<br><br>
      <strong>Neues Konzept.</strong>
    </p>

<!--
    <div class="contacts">
      <a class="contact" href="mailto:info@rerora.de">
        E-Mail senden
      </a>
    </div>
-->

    <div class="footer">
      Persönlich. Unkompliziert. Direkt vor Ort.
      
      <div class="legal-links">
        <button onclick="openModal('impressum')">Impressum</button> | 
        <button onclick="openModal('datenschutz')">Datenschutz</button>
      </div>
    </div>
  </main>
  
<!-- Generisches Modal für Rechtliches -->
  <div class="modal" id="legal-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modal-legal-body"></div>
    </div>
  </div>

  <!-- Zentrale Rechtstexte laden -->
  <script src="legal.js"></script>

  <script>
    function openModal(type) {
      const modalBody = document.getElementById('modal-legal-body');
      
      if (typeof LEGAL_TEXTS !== 'undefined' && LEGAL_TEXTS[type]) {
        modalBody.innerHTML = LEGAL_TEXTS[type];
      } else {
        modalBody.innerHTML = '<p>Inhalt konnte leider nicht geladen werden.</p>';
      }

      document.getElementById('legal-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('legal-modal').classList.remove('active');
    }
  </script>
  
</body>
</html>
