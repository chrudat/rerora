<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RERORA</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      color: #171717;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px 24px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #777;
    }

    .legal-links a {
      color: #777;
      text-decoration: underline;
      margin: 0 6px;
      cursor: pointer;
    }

    /* --- Modal Style --- */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #fff;
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      border-radius: 16px;
      text-align: left;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .modal-content h2 {
      margin-top: 0;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #777;
    }
  </style>
</head>
<body>

  <main class="card">
    <!-- Hier steht dein bisheriger Card-Inhalt -->
    
    <div class="footer">
      Persönlich. Unkompliziert. Direkt vor Ort.
      <div class="legal-links" style="margin-top: 16px;">
        <a onclick="openModal()">Impressum</a> | <a href="/datenschutz.html">Datenschutz</a>
      </div>
    </div>
  </main>

  <!-- Modal/Overlay Fenster -->
  <div class="modal" id="impressum-modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2>Impressum</h2>
      <p>
        <strong>Angaben gemäß § 5 DDG:</strong><br>
        [Dein Vor- und Nachname]<br>
        [Straße und Hausnummer]<br>
        [PLZ und Ort]
      </p>
      <p>
        <strong>Kontakt:</strong><br>
        E-Mail: kontakt@rerora.de
      </p>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('impressum-modal').classList.add('active');
    }
    function closeModal(e) {
      document.getElementById('impressum-modal').classList.remove('active');
    }
  </script>

</body>
</html>
